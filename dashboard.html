<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kaptan Ark - Dashboard</title>
    <style>
        body { margin: 0; display: flex; background: #0c0d10; color: #fff; font-family: sans-serif; }
        .sidebar { width: 260px; background: #161920; height: 100vh; padding: 20px; border-right: 1px solid #23272A; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #5865F2; margin-bottom: 40px; }
        .menu-item { color: #b9bbbe; padding: 12px; cursor: pointer; border-radius: 6px; margin-bottom: 5px; }
        .menu-item:hover { background: #23272A; color: white; }
        .main { flex: 1; padding: 40px; }
        .server-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: #161920; padding: 20px; border-radius: 10px; border: 1px solid #23272A; text-align: center; }
        .btn-manage { background: #5865F2; padding: 10px; border-radius: 5px; color: white; text-decoration: none; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Kaptan Ark</div>
        <div class="menu-item">Sunucularım</div>
        <div class="menu-item">Profil</div>
        <div class="menu-item" style="color: #ed4245;">Çıkış Yap</div>
    </div>
    <div class="main">
        <h1>Sunucu Yönetimi</h1>
        <div class="server-grid">
            <div class="card">
                <h3>V8 Strength Stüdyo</h3>
                <a href="#" class="btn-manage">Yönetim Paneline Git</a>
            </div>
            <div class="card">
                <h3>Kaptan'ın Yeri</h3>
                <a href="#" class="btn-manage">Yönetim Paneline Git</a>
            </div>
        </div>
    </div>
</body>
</html>
