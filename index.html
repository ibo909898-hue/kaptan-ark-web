<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaptan Ark - Discord Botu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; text-align: center; }
        .container { max-width: 800px; padding: 20px; }
        h1 { font-size: 3rem; margin-bottom: 20px; color: #5865F2; text-shadow: 0 0 20px rgba(88, 101, 242, 0.5); }
        p { font-size: 1.2rem; color: #8b949e; margin-bottom: 30px; }
        .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { background-color: #5865F2; color: white; padding: 12px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); }
        .btn:hover { background-color: #4752c4; transform: translateY(-2px); }
        .btn-secondary { background-color: #21262d; border: 1px solid #30363d; }
        .btn-secondary:hover { background-color: #30363d; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kaptan Ark</h1>
        <p>Sunucunuzu yönetmenin en modern, en güçlü ve en karizmatik yolu. Kaptan'ın emrinde şimdi sizlerle!</p>
        
        <div class="btn-group">
            <a href="dashboard.html" class="btn">Discord ile Giriş Yap</a>
            <a href="#" class="btn btn-secondary">Botu Ekle</a>
        </div>
    </div>

</body>
</html>
